apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "o11ylite.fullname" . }}
  labels:
    {{- include "o11ylite.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "o11ylite.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "o11ylite.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "o11ylite.labels" . | nindent 8 }}
    spec:
      containers:
        - name: o11ylite
          image: {{ include "o11ylite.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
