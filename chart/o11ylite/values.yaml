image:
  repository: ghcr.io/o11ylite/o11ylite
  pullPolicy: IfNotPresent
  # Defaults to .Chart.AppVersion if not set
  tag: ""

# Additional labels to apply to the pod template.
podLabels: {}

# Additional annotations to apply to the pod template.
# Example – enable OpenTelemetry auto-instrumentation via the OTel Operator:
#   instrumentation.opentelemetry.io/inject-java: "true"
podAnnotations: {}

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: false
  size: 10Gi
  # storageClass: ""

# Pod-level security context applied to the StatefulSet.
# fsGroup ensures Kubernetes sets the volume's group ownership so the
# o11ylite process (GID 998) can write to mounted PVCs.
# Set to {} to disable.
podSecurityContext:
  fsGroup: 998

resources: {}
  # limits:
  #   cpu: "2"
  #   memory: 4Gi
  # requests:
  #   cpu: "1"
  #   memory: 2Gi

env: []
  # - name: O11YLITE_DATA_PATH
  #   value: /data

# Reference an existing Kubernetes Secret whose keys will be injected as
# environment variables (via envFrom). Useful for credentials like
# O11YLITE_OIDC_CLIENT_SECRET that should not live in values.yaml.
existingSecret: ""
